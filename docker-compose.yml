# Complete stack: Letta App Server (letta-code image, :4500) + this MCP server (:6507).
# The App Server runs straight from the prebuilt ghcr.io/letta-ai/letta-code
# image — same `letta server` command the official deploy repo uses, no build.
#
# Quick start:
#   cp .env.example .env   # set LETTA_APP_SERVER_TOKEN + a model key
#   docker compose up -d
#   curl http://127.0.0.1:4500/readyz          # App Server
#   curl http://127.0.0.1:6507/healthz         # MCP server
services:
  app-server:
    image: ghcr.io/letta-ai/letta-code:${LETTA_CODE_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - LETTA_BACKEND=${LETTA_BACKEND:-local}
      - PORT=${APP_SERVER_PORT:-4500}
    ports:
      - "${APP_SERVER_PORT:-4500}:${APP_SERVER_PORT:-4500}"
    volumes:
      - letta-state:/root/.letta
      - letta-workspace:/workspace
    # Capability-token WS auth; token itself comes from .env, never baked in.
    command:
      - sh
      - -c
      - |
        set -eu
        port="$${PORT:-4500}"
        umask 077
        printf '%s' "$$LETTA_APP_SERVER_TOKEN" > /tmp/letta-app-server-token
        exec letta server --backend "$${LETTA_BACKEND:-local}" \
          --listen "ws://0.0.0.0:$$port" \
          --ws-auth capability-token \
          --ws-token-file /tmp/letta-app-server-token
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${APP_SERVER_PORT:-4500}/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Talk to the App Server over the compose network (same port as PORT above).
      - LETTA_APP_SERVER_URL=http://app-server:${APP_SERVER_PORT:-4500}
    ports:
      - "${MCP_PORT:-6507}:6507"
    depends_on:
      app-server:
        condition: service_healthy

volumes:
  letta-state:
  letta-workspace:
